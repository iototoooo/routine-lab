name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:static
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 公開値のダミーでビルドできることを確認する（本物の値は Cloudflare Pages 側にだけ置く）
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-dummy
      - run: node scripts/check-secrets.mjs out
